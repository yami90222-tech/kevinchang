                { id: 2, prompt: "Jimmy: What h______ed to you?\nJane: I broke my leg on the way home.", word: "happened", hint: "發生 (過去式)", sentence: "What happened to you?", exp: "happen為不及物動詞，問句『發生什麼事了？』常用 What happened to you?" },
                { id: 3, prompt: "Babies are always c______ous about everything around them.", word: "curious", hint: "好奇的", sentence: "be curious about...", exp: "be curious about 表示『對……感到好奇』。" },
                { id: 4, prompt: "Take a g______ss. What's in the box?", word: "guess", hint: "猜測 (名詞)", sentence: "Take a guess.", exp: "Take a guess 為固定句型，意為『猜猜看』。" },
                { id: 5, prompt: "There were too many cars. The little girl was s______d. She couldn't cross the street.", word: "scared", hint: "害怕的", sentence: "feel scared", exp: "scared 為形容詞『感到害怕的』，修飾人的情緒。" },
                { id: 6, prompt: "Find a partner, and finish the work in p______rs.", word: "pairs", hint: "兩兩成對 (複數)", sentence: "in pairs", exp: "in pairs 為片語，意為『成對地；兩人一組地』。" },
                { id: 7, prompt: "Dad shouldn't drive for more than three hours w______out taking a break.", word: "without", hint: "沒有/未... (介系詞)", sentence: "without + V-ing", exp: "without 為介系詞，後面接動名詞 taking。意為『沒有休息』。" },
                { id: 8, prompt: "The baby is sleeping in her father's a______ms. Isn't it sweet?", word: "arms", hint: "手臂 (雙臂複數)", sentence: "in one's arms", exp: "in one's arms 指『在某人的懷抱中/雙臂裡』。" },
                { id: 9, prompt: "I got a t______le grade on the math test.", word: "terrible", hint: "糟糕的/極壞的", sentence: "terrible grade", exp: "terrible 意為『糟糕的；可怕的』，修飾成績 (grade)。" },
                { id: 10, prompt: "Did you e______er eat anything special?", word: "ever", hint: "曾經", sentence: "Did you ever...?", exp: "ever 常用於疑問句中，表示『曾經』。" }

            // Section 2: Multiple Choice
            multipleChoice: [
                {
                    id: 1,
                    question: "Mary had a bad cough and a headache, _____ she took some medicine.",
                    options: ["(A) but", "(B) ✗", "(C) so", "(D) because"],
                    answer: "C",
                    explanation: "前半句是『原因』（咳嗽又頭痛），後半句是『結果』（吃藥）。故選連接詞 so（所以）。"
                },
                {
                    id: 2,
                    question: "Louis didn't have breakfast at home, _____ he is hungry now.",
                    options: ["(A) because", "(B) after", "(C) but", "(D) so"],
                    answer: "D",
                    explanation: "前一句『沒有吃早餐』，後一句『現在很餓』，前後為因果關係，故用 so。"
                },
                {
                    id: 3,
                    question: "Aaron walked on crutches because he had an accident and _____ his leg.",
                    options: ["(A) broke", "(B) break", "(C) breaking", "(D) breaks"],
                    answer: "A",
                    explanation: "由句中的 walked (過去式) 及 had (過去式) 可知全句述說過去事件，and 連接對等動詞，故使用動詞過去式 broke。"
                },
                {
                    id: 4,
                    question: "We shouldn't argue _____.",
                    options: ["(A) still", "(B) more", "(C) anymore", "(D) one more"],
                    answer: "C",
                    explanation: "not... anymore 意為『再也不……；不再……』。全句意為：我們不應該再爭吵了。"
                },
                {
                    id: 5,
                    question: "Nancy read the special book and _____ it on the desk.",
                    options: ["(A) put", "(B) puts", "(C) is putting", "(D) can put"],
                    answer: "A",
                    explanation: "read 在此處為過去式（發音 /red/，主詞 Nancy 三單但無加 s），and 連接過去式動詞 put（put-put-put 三態同形）。"
                },
                {
                    id: 6,
                    question: "The kid fell down, but _____ helped him.",
                    options: ["(A) nobody", "(B) nothing", "(C) anybody", "(D) something"],
                    answer: "A",
                    explanation: "句意：小孩摔倒了，但『沒有人』幫他。nobody 表示『沒有人』。"
                },
                {
                    id: 7,
                    question: "Mike _____ new shoes last week.",
                    options: ["(A) buy", "(B) buys", "(C) bought", "(D) is buying"],
                    answer: "C",
                    explanation: "時間副詞為 last week（上週），句意為過去發生的事實，故動詞 buy 須用過去式 bought。"
                },
                {
                    id: 8,
                    question: "Greg: How was the movie?\nZoe: Good! It had a happy _____.",
                    options: ["(A) end", "(B) ending", "(C) story", "(D) circle"],
                    answer: "B",
                    explanation: "happy ending 意為『完美的結局』，ending 在此做名詞，指電影或故事的結局。"
                },
                {
                    id: 9,
                    question: "Emily: _____ didn't the girl go to school?\nDebby: She didn't go to school because she was sick.",
                    options: ["(A) How", "(B) Where", "(C) Why", "(D) Who"],
                    answer: "C",
                    explanation: "答句用了 because（因為），表示回答原因，故問句須用疑問詞 Why（為什麼）來提問。"
                },
                {
                    id: 10,
                    question: "Sara sold her car _____ her friend.",
                    options: ["(A) to", "(B) of", "(C) at", "(D) with"],
                    answer: "A",
                    explanation: "授受動詞 sell (sold) 表示『賣給某人』時，介系詞搭配 to。句型：sell sth to sb。"
                },
                {
                    id: 11,
                    question: "Olivia: Child marriage is happening in many countries. What can we do against it?\nBob: _____\n(*against 與...對抗)",
                    options: [
                        "(A) We can make money.",
                        "(B) It's not happening now.",
                        "(C) They have babies at young ages.",
                        "(D) We can write letters to their countries and speak out."
                    ],
                    answer: "D",
                    explanation: "針對『我們可以採取什麼對抗童婚問題？』，最適當的回答是 (D) 我們可以寫信給那些國家並勇敢發聲 (speak out)。"
                },
                {
                    id: 12,
                    question: "Betty: A young girl got married to a 40-year-old man and had her first baby at the age of 13.\nNeil: _____ That's too young.",
                    options: [
                        "(A) Where is her baby?",
                        "(B) How is this possible?",
                        "(C) Isn't her husband kind to her?",
                        "(D) Does her husband always think of her?"
                    ],
                    answer: "B",
                    explanation: "聽到 13 歲女孩嫁給 40 歲男人並生子，Neil 感到震驚與不可思議，最合適的社交回應為 How is this possible?（這怎麼可能？）"
                }
            ],

            // Section 3: Sentence Transformation
            sentenceRewrite: [
                {
                    id: 1,
                    prompt: "The young mother could not go to school because her babies needed her.\n(用 so 改寫句子)",
                    answer: "The young mother's babies needed her, so she could not go to school.",
                    explanation: "because 表原因，so 表結果。改寫時須先敘述原因『寶寶需要她』，再加上 so 引導結果『她無法去上學』。注意代名詞主詞與名詞的呼應。"
                },
                {
                    id: 2,
                    prompt: "It is cold outside, so I wear a heavy jacket.\n(用過去式改寫句子)",
                    answer: "It was cold outside, so I wore a heavy jacket.",
                    explanation: "將現在式動詞 is 改為過去式 was；wear（穿）改為過去式 wore。"
                }

            // Section 4: Translation
            translation: [
                {
                    id: 1,
                    chinese: "那位 12 歲的小女孩和一位 65 歲的男人結了婚，因為她的家庭需要錢。",

                    id: 2,
                    chinese: "Nick 因為摔斷一隻手臂，再也無法去工作。",

                },

                    chinese: "數百萬計 18 歲以下的孩童需要我們的幫助。",
                    english: "Millions of children under the age of eighteen need our help.",

                }
            ],

            // Section 5: Cloze (Malala Story)
            cloze: {
                article: `At one time in Pakistan, girls couldn't go to school [1] because of the ruling Taliban. However, Malala [2] for girls' right to education. One day, she went to school [3] any other day. [4] her bus ride to school, two men in black masks [5] the bus and shot Malala in the head. Luckily, Malala didn't die.\n\nAfter that, more people knew her story. In 2014, she [6] the Nobel Peace Prize. During her speech at the UN, she shared simple but powerful words: "One child, one teacher, one book and one pen can change the world. Education is the only solution."`,
                vocabularyNotes: [
                    { word: "rule", def: "統治" },
                    { word: "powerful", def: "強大的；有影響力的" },
                    { word: "education", def: "教育" }
                ],
                questions: [
                    { id: 1, options: ["(A) fight", "(B) fights", "(C) fought", "(D) can fight"], answer: "C", exp: "Malala 為爭取女孩受教權而『奮鬥』，文章為過去發生的歷史事實，動詞 fight 須用過去式 fought。" },
                    { id: 2, options: ["(A) like", "(B) likes", "(C) liked", "(D) can like"], answer: "A", exp: "like 這裡作介系詞，意為『像……一樣』。like any other day 意為『像往常的任何一天一樣』。" },
                    { id: 3, options: ["(A) Of", "(B) At", "(C) In", "(D) On"], answer: "D", exp: "在搭乘公車期間/在公車旅程中，表達特定的搭乘期間或平面交通時用介系詞 On her bus ride。" },
                    { id: 4, options: ["(A) take", "(B) took", "(C) get on", "(D) got on"], answer: "D", exp: "蒙面男子『上了公車』， get on 表示上了大型交通工具，過去式為 got on。" },
                    { id: 5, options: ["(A) win", "(B) wins", "(C) won", "(D) can win"], answer: "C", exp: "2014 年她『贏得』諾貝爾和平獎，過去發生的事情使用過去式 won (原形為 win)。" },
                    { id: 6, options: ["(A) change", "(B) changes", "(C) changed", "(D) changing"], answer: "A", exp: "助動詞 can 後面必須接『原形動詞』 change。" }
                ]
            },

            // Section 6: Reading Comprehension
            readingComprehension: [
                {
                    title: "Part A: Water Crisis in South of Sahara Desert",
                    passage: `783 million people live without clean water in the world. Of the 783 million people, 40% live south of the Sahara Desert. For people there, water is not just important; water is the key to a normal life.

In South Sudan, Niger, Chad and Somalia, girls often spend about 6 hours every day getting water. Because of this, they can't go to school often, and they can't read very much. Without enough knowledge, the girls have few choices about jobs or marriages. Usually, the girls get married and have babies at a young age. Because they are so young, they can't take good care of their babies. The babies often die at a young age. Living babies suffer from a shortage of clean water, just like their mothers.`,
                    questions: [
                        {
                            id: 1,
                            question: "What is the main idea of the reading?",
                            options: [
                                "(A) Some girls in the south of the Sahara Desert save water for poor people.",
                                "(B) Some girls in the south of the Sahara Desert spend 6 hours carrying water every day.",
                                "(C) Some girls in the south of the Sahara Desert cannot read because they can't go to school.",
                                "(D) Some girls in the south of the Sahara Desert can't have a good life because there isn't enough water."
                            ],
                            answer: "D",
                            explanation: "全文主旨探討『因為缺乏乾淨水源，導致女孩無法就學、早婚、嬰兒夭折等連鎖問題，無法擁有好生活』，故選 (D)。"
                        },
                        {
                            id: 2,
                            question: "What is true from the reading?",
                            options: [
                                "(A) Boys in the south of the Sahara Desert have enough clean water.",
                                "(B) Girls in the south of the Sahara Desert can't go to school.",
                                "(C) Over 300 million people in the south of the Sahara Desert live without clean water.",
                                "(D) 783 million people in the south of the Sahara Desert live without clean water."
                            ],
                            answer: "C",
                            explanation: "全球有 783 百萬人缺水，其中 40% 住在撒哈拉以南。算式：783M × 0.4 = 313.2M (超過 300 million)，故 (C) 為正確選項。"
                        }
                    ]
                },
                {
                    title: "Part B: Fair Trade Coffee & Child Labor Cycle",
                    passage: `Coffee is a very popular drink, but did you know that the people who grow coffee, called coffee farmers, often don't get much money from selling it? In fact, they usually only get around 7-10% of the money made from selling coffee. That's not fair, right?

To make matters worse, these farmers sometimes have to ask their own children to help them on the coffee farms. [ B ] It's sad because they miss out on getting a good education.

When these children grow up, they don't have the skills or knowledge they need for better jobs. So, what happens? They become coffee farmers themselves, and the cycle continues. [ C ]

We can't let this keep happening. [ A ] They deserve a chance to go to school and have a brighter future. Let's work together to make a difference.`,
                    insertedSentenceOptions: [
                        "(A) We need to take action and do something to help these children.",
                        "(B) This means the kids have to stop going to school and work instead.",
                        "(C) It's like a never-ending circle."

                    questions: [
                        {
                            id: 3,
                            question: "請根據文意，將句子代號 (A), (B), (C) 填入適當的空格中：",
                            answersDetail: [
                                "第一個空格 [ B ] 應填：(B) This means the kids have to stop going to school and work instead. (承接前面孩童被要求去咖啡園幫忙)",

                        }
                    ]
                }
            ]
        };

        function App() {
            const [activeTab, setActiveTab] = useState('vocab');
            const [mode, setMode] = useState('study'); // 'study' or 'test'
            const [userVocabInputs, setUserVocabInputs] = useState({});
            const [userMcqAnswers, setUserMcqAnswers] = useState({});
            const [userClozeAnswers, setUserClozeAnswers] = useState({});
            const [userMcqSelection, setUserMcqSelection] = useState({});
            const [showAllAnswers, setShowAllAnswers] = useState(false);
            const [bookmarked, setBookmarked] = useState([]);

            // Speech Synthesis helper
            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert('您的瀏覽器不支援語音朗讀功能');
                }
            };

            const toggleBookmark = (id) => {
                setBookmarked(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
            };

            // Calculate Score for Test Mode
            const calculateScore = useMemo(() => {
                let correctCount = 0;
                let totalCount = 0;

                // Vocab
                examData.vocabulary.forEach(v => {
                    totalCount++;
                    if ((userVocabInputs[v.id] || '').trim().toLowerCase() === v.word.toLowerCase()) {
                        correctCount++;
                    }
                });

                // MCQ
                examData.multipleChoice.forEach(m => {
                    totalCount++;
                    if (userMcqAnswers[m.id] === m.answer) {
                        correctCount++;
                    }
                });

                // Cloze
                examData.cloze.questions.forEach(c => {
                    totalCount++;
                    if (userClozeAnswers[c.id] === c.answer) {
                        correctCount++;
                    }
                });

                const score = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
                return { correctCount, totalCount, score };
            }, [userVocabInputs, userMcqAnswers, userClozeAnswers]);

            return (
                <div className="min-h-screen flex flex-col">
                    {}
                    {/* Top Header */}
                    <header className="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">

                                    <h1 className="text-lg font-bold leading-tight">{examData.title}</h1>
                                    <p className="text-xs text-sky-300 font-medium">{examData.grade}</p>

                            <div className="flex items-center space-x-3">

                                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${mode === 'study' ? 'bg-sky-500 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        <i className="fa-solid fa-book-open mr-1.5"></i>學習解析模式
                                    </button>
                                    <button 
                                        onClick={() => setMode('test')}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${mode === 'test' ? 'bg-amber-500 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                                    >
                                        <i className="fa-solid fa-pen-to-square mr-1.5"></i>實測挑戰模式
                                    </button>
                                </div>

                                {mode === 'test' && (
                                    <div className="hidden sm:flex items-center bg-slate-800 px-3 py-1.5 rounded-xl border border-amber-500/30">
                                        <span className="text-xs text-slate-300 mr-2">預估得分:</span>
                                        <span className="text-amber-400 font-extrabold text-sm">{calculateScore.score} 分</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Sub Header Focus Topics */}
                    <section className="bg-sky-900 text-sky-100 py-3 border-b border-sky-800 text-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center gap-2">
                            <span className="font-bold bg-sky-700 text-sky-200 px-2 py-0.5 rounded text-[11px] uppercase tracking-wider">
                                拔尖關鍵考點
                            </span>
                            {examData.topics.map((topic, index) => (
                                <span key={index} className="bg-sky-800/80 px-2.5 py-1 rounded-full flex items-center gap-1.5">
                                    <i className="fa-solid fa-check text-sky-400 text-[10px]"></i>
                                    {topic}
                                </span>
                            ))}
                        </div>
                    </section>

                    {}
                    {/* Navigation Tabs */}
                    <div className="bg-white border-b border-slate-200 sticky top-16 z-40 shadow-sm">

                                        {examData.cloze.questions.map((q, qIdx) => {
                                            const selected = userClozeAnswers[q.id];
                                            const isRevealed = showAllAnswers || mode === 'study';

                                            return (
                                                <div key={q.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-bold bg-slate-800 text-white w-5 h-5 rounded-full flex items-center justify-center">
                                                            {q.id}
                                                        </span>
                                                        {isRevealed && (
                                                            <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">
                                                                解答: ({q.answer})
                                                            </span>
                                                        )}
                                                    </div>

                                                    <div className="grid grid-cols-2 gap-1.5">
                                                        {q.options.map((opt, oIdx) => {
                                                            const optCode = opt.charAt(1);
                                                            const isSelected = selected === optCode;
                                                            let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
                                                            
                                                            if (isSelected) {
                                                                btnStyle = mode === 'study'
                                                                    ? optCode === q.answer ? "bg-emerald-100 border-emerald-500 font-bold" : "bg-rose-100 border-rose-400 font-bold"
                                                                    : "bg-sky-500 text-white font-bold";
                                                            } else if (isRevealed && optCode === q.answer) {
                                                                btnStyle = "bg-emerald-50 border-emerald-400 font-bold text-emerald-800";
                                                            }

                                                            return (
                                                                <button
                                                                    key={oIdx}
                                                                    onClick={() => setUserClozeAnswers({...userClozeAnswers, [q.id]: optCode})}
                                                                    className={`px-2.5 py-1.5 rounded text-xs border text-left transition ${btnStyle}`}
                                                                >
                                                                    {opt}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>

                                                    {isRevealed && (
                                                        <p className="text-[11px] text-slate-600 bg-sky-50 p-2 rounded mt-1 border border-sky-100">
                                                            {q.exp}
                                                        </p>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: READING COMPREHENSION */}
                        {activeTab === 'reading' && (
                            <div className="space-y-6">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h2 className="text-lg font-bold text-slate-800">六、閱讀測驗 (每題 3 分，共 15 分)</h2>
                                    <p className="text-xs text-slate-500">探討撒哈拉缺水危機與公平貿易咖啡童工惡性循環。</p>
                                </div>

                                {/* Article A */}
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                    <h3 className="font-bold text-slate-800 text-base border-b border-slate-100 pb-2">
                                        {examData.readingComprehension[0].title}
                                    </h3>
                                    <p className="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line bg-slate-50 p-4 rounded-xl">
                                        {examData.readingComprehension[0].passage}
                                    </p>

                                    <div className="space-y-4 pt-2">
                                        {examData.readingComprehension[0].questions.map((q) => (
                                            <div key={q.id} className="border-t border-slate-100 pt-3">
                                                <p className="text-xs sm:text-sm font-semibold text-slate-800 mb-2">
                                                    {q.id}. {q.question}
                                                </p>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                                                    {q.options.map((opt, oIdx) => (
                                                        <div key={oIdx} className="bg-slate-50 p-2 rounded text-xs text-slate-700 border border-slate-200">
                                                            {opt}
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="bg-emerald-50 p-2.5 rounded-lg border border-emerald-100 text-xs text-emerald-900">
                                                    <strong>解答: ({q.answer})</strong> — {q.explanation}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Article B */}
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                    <h3 className="font-bold text-slate-800 text-base border-b border-slate-100 pb-2">
                                        {examData.readingComprehension[1].title}
                                    </h3>
                                    <p className="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line bg-slate-50 p-4 rounded-xl">
                                        {examData.readingComprehension[1].passage}
                                    </p>

                                    <div className="bg-sky-50 p-3 rounded-lg border border-sky-100">
                                        <div className="text-xs font-bold text-sky-800 mb-1">待填入的句子選項：</div>
                                        <ul className="text-xs text-slate-700 space-y-1">
                                            {examData.readingComprehension[1].insertedSentenceOptions.map((s, idx) => (
                                                <li key={idx} className="font-medium">{s}</li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="border-t border-slate-100 pt-3 space-y-2">
                                        <p className="text-xs sm:text-sm font-semibold text-slate-800">
                                            {examData.readingComprehension[1].questions[0].question}
                                        </p>
                                        <div className="bg-emerald-50 p-3.5 rounded-lg border border-emerald-100 space-y-1.5 text-xs text-emerald-900">
                                            {examData.readingComprehension[1].questions[0].answersDetail.map((ans, aIdx) => (
                                                <div key={aIdx} className="flex items-start space-x-1.5">
                                                    <i className="fa-solid fa-check text-emerald-600 mt-0.5"></i>
                                                    <span>{ans}</span>
                                                </div>
                                            ))}
                                            <div className="pt-2 text-slate-600 border-t border-emerald-200/50 mt-2">
                                                <strong>解析邏輯：</strong> {examData.readingComprehension[1].questions[0].explanation}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-12 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 text-center space-y-2">
                            <p className="font-medium text-slate-300">國中英語(三) 挑戰卷 (L.2) 互動式教學解析系統</p>
                            <p className="text-slate-500">設計宗旨：協助八年級學生理解因果連接詞 (because/so) 應用與人權全球議題閱讀解析。</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render the App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
