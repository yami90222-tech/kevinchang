  <script>
    const examData = [
      // Vocabulary
      { id: 1, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'Lisa loves eating fast food, but her doctor told her to be careful with her health. Now, she is trying to change her eating habits and follow a healthy ____.', options: ['(A) choice', '(B) diet', '(C) wish', '(D) letter'], answer: 1, explanation: '句子提到 Lisa 需要改變飲食習慣，並注意健康，這與 diet（飲食、節食）最符合。', tags: ['字彙分析', '生活實用'], translation: 'Lisa 喜歡吃快餐，但她的醫生告訴她要注意健康。現在，她正試圖改變飲食習慣，並遵循健康的飲食 (diet)。' },
      { id: 2, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'Ela didn’t understand what skip meant in the sentence below:\n"Tim is always busy with schoolwork. To save time in the morning, he often skips breakfast and just drinks a cup of coffee."\nShe looked it up in the dictionary and found more than one meaning. What does skip mean here?', options: ['(A) To jump over a rope.', '(B) To leave out or not do something.', '(C) To move in a happy and light way.', '(D) To move quickly with small jumps.'], answer: 1, explanation: '句中的 Tim 為了省時間而不吃早餐，與 leave out or not do something（省略、不做某事）的意思相符，故選 (B)。', tags: ['字義推論', '會考閱讀素養'], translation: '句中 Tim 為了省時間而不吃早餐，這裡 skip 意思是「省略、不做某事」。' },
      { id: 3, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, svgType: 'angry_boy', question: 'Look at the picture. How does the boy feel about the garbage? He feels ____.', options: ['(A) happy', '(B) angry', '(C) worried', '(D) different'], answer: 1, explanation: '看圖得知，男孩握緊拳頭且頭上帶有生氣符號，感受應該是「生氣的」，故選 (B)。', tags: ['看圖理解', '會考題型'], translation: '看圖：男孩對垃圾感到怎麼樣？他感到生氣 (angry)。' },
      { id: 4, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, svgType: 'buying_envelope', question: 'Look at the picture. What is the girl doing now? She is ____.', options: ['(A) writing a letter', '(B) copying the answers on a test', '(C) drinking a glass of water', '(D) buying an envelope'], answer: 3, explanation: '看圖得知，女孩正在櫃檯前向店員「購買信封」，故選 (D)。', tags: ['看圖理解', '生活字彙'], translation: '女孩現在正在做什麼？她正在購買信封 (buying an envelope)。' },
      { id: 5, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'My cousin and I have ____ for a month, so we both look slim in the photo.', options: ['(A) gone abroad', '(B) been on a diet', '(C) washed our hands very often', '(D) talked on the phone'], answer: 1, explanation: '我的堂妹和我已經「節食 (been on a diet)」一個月了，所以我們兩個在照片裡看起來很瘦，故選 (B)。', tags: ['片語搭配', '現在完成式'], translation: '我和我堂妹已經節食一個月了，所以我們在照片裡看起來都很苗條。' },
      { id: 6, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'Lisa can ____ very fast on the computer, so she always helps the teacher write emails and finish reports in class.', options: ['(A) type', '(B) copy', '(C) skip', '(D) wish'], answer: 0, explanation: '句子提到 Lisa 在電腦上動作很快，能幫助老師寫電子郵件和完成報告，type（打字）最符合，故選 (A)。', tags: ['資訊字彙', '上下文理解'], translation: 'Lisa 在電腦上打字 (type) 很快，所以她總是能在課堂上幫老師寫電子郵件和完成報告。' },
      { id: 7, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'Last night, the writer felt unhappy about his new book; he went crazy, tore it angrily and stamped on it. He has to start all over again.\nWhat does stamped on it mean here?', options: ['(A) Put his feet on it and stood on it.', '(B) Sent it to the store or sold it.', '(C) Bought it and cooked it.', '(D) Made a choice or a decision.'], answer: 0, explanation: 'stamp 當動詞有踐踏、腳踩的意思，對應 (A) Put his feet on it and stood on it。', tags: ['動詞推論', '文章情節'], translation: '作家生氣地撕爛作品並用腳踐踏它 (stamped on it)。' },
      { id: 8, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, badge: '109.會考', question: 'Can you ____ your feet a little off the floor? I want to see if my keys are under the sofa.〔109.會考〕', options: ['(A) check', '(B) kick', '(C) raise', '(D) show'], answer: 2, explanation: '把腳「抬起 (raise)」離地，才能看到沙發底下的鑰匙，答案選 (C)。', tags: ['歷屆會考題', '核心動詞'], translation: '你可以把你的腳抬離地面一點嗎？我想看看我的鑰匙是不是在沙發下面。' },
      { id: 9, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, svgType: 'scared_ghost', question: 'Last night, I thought I saw a ____ beside my bed, so I cried out and ran out of my room.', options: ['(A) heart', '(B) somebody', '(C) ghost', '(D) ticket'], answer: 2, explanation: '看圖可知，床邊有一隻「鬼 (ghost)」，故選 (C)。注意 (B) somebody 前不加冠詞 a。', tags: ['看圖選擇', '情境字彙'], translation: '昨晚我以為我在床邊看到一隻鬼 (ghost)，所以我大叫並衝出了房間。' },
      { id: 10, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, svgType: 'castle_tour', question: 'Look at the picture. What are these people doing?', options: ['(A) Downloading something online.', '(B) Going to the movie theater.', '(C) Watching the full moon.', '(D) Walking to an old castle.'], answer: 3, explanation: '看圖可知，人們正走近城堡，選 (D) Walking to an old castle。', tags: ['看圖理解', '情境動作'], translation: '照片中的人們正在做什麼？正在走向一座古堡。' },
      { id: 11, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'We need to ____ a hotel before our trip to make sure we have a place to stay.', options: ['(A) book', '(B) read', '(C) write', '(D) check'], answer: 0, explanation: '「book」做動詞表示「預訂」，最符合預訂飯店之句意。', tags: ['多義字演練', '旅遊字彙'], translation: '我們需要在旅行前預訂 (book) 飯店，以確保有地方住。' },
      { id: 12, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'Before the movie started, the workers set the chairs and tables in the outdoor theater so people could sit comfortably.\nWhat does set mean here?', options: ['(A) A group of things that go together.', '(B) To put things in the right place.', '(C) To become hard after some time.', '(D) A place where movies are made.'], answer: 1, explanation: '「擺放」戶外劇場的座位和桌子，set 表示「擺放、安排 (To put things in the right place)」，故選 (B)。', tags: ['字義推論', '一詞多義'], translation: '工作人員將椅子和桌子擺放妥當 (set)。' },
      { id: 13, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, badge: '113.會考', question: 'Our school basketball team won the national game last night. We are so ____ them.〔113.會考〕', options: ['(A) popular with', '(B) proud of', '(C) sorry for', '(D) worried about'], answer: 1, explanation: '籃球隊贏得了全國比賽，可推論我們「以…為榮 (be proud of)」，答案為 (B)。', tags: ['歷屆會考題', '常用形容詞片語'], translation: '我們學校的籃球隊昨晚贏得了全國比賽。我們真為他們感到驕傲 (proud of)。' },
      { id: 14, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'Emma understands that not all the news is true, so she always checks the ____ of the information before believing it.', options: ['(A) sentence', '(B) piece', '(C) source', '(D) ticket'], answer: 2, explanation: '在相信新聞前需確認資訊的「來源 (source)」，故選 (C)。', tags: ['媒體素養', '核心字彙'], translation: 'Emma 在相信新聞之前總是會確認資訊的來源 (source)。' },
      { id: 15, cat: 'vocab', catTitle: '字彙選擇', score: 2.5, question: 'The new movie was a big hit. Many people went to see it, and everyone was talking about it.\nWhat does hit mean here?', options: ['(A) To touch something hard.', '(B) Something that is very popular and successful.', '(C) To push a door.', '(D) To get to a place.'], answer: 1, explanation: '名詞 a big hit 表示「非常受歡迎且成功的事物」，選 (B)。', tags: ['字義推論', '閱讀素養'], translation: '這部新電影大受歡迎 (a big hit)。' },

    let currentTab = 'study';
    let currentCategory = 'all';
    let searchQuery = '';
    let userAnswers = {};
    let bookmarkedIds = new Set();
    let checkedQuizIds = new Set();

    document.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });

    function switchTab(tab) {
      currentTab = tab;
      ['study', 'quiz', 'bookmarks'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        const view = document.getElementById(`view-${t}`);
        if (t === tab) {
          btn.className = 'px-4 py-1.5 rounded-lg text-sky-700 bg-white shadow-sm font-semibold transition-all flex items-center gap-2';
          view.classList.remove('hidden');
        } else {
          btn.className = 'px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2';
          view.classList.add('hidden');
        }
      });
      renderAll();
    }

    function toggleMobileMenu() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = (btn.dataset.cat === cat)
          ? 'cat-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white transition-all'
          : 'cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all';
      });
      renderAll();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderAll();
    }

    function toggleBookmark(qId) {
      if (bookmarkedIds.has(qId)) bookmarkedIds.delete(qId);
      else bookmarkedIds.add(qId);
      document.getElementById('bookmark-count').innerText = bookmarkedIds.size;
      renderAll();
    }

    function getFilteredData() {
      return examData.filter(q => {
        if (currentCategory !== 'all' && q.cat !== currentCategory) return false;
        if (searchQuery) {
          const inNum = q.id.toString() === searchQuery;
          const inQ = q.question.toLowerCase().includes(searchQuery);
          const inExp = q.explanation.toLowerCase().includes(searchQuery);
          const inTag = q.tags && q.tags.some(t => t.toLowerCase().includes(searchQuery));
          if (!inNum && !inQ && !inExp && !inTag) return false;
        }
        return true;
      });
    }

    function renderAll() {
      if (currentTab === 'study') renderStudyMode();
      else if (currentTab === 'quiz') renderQuizMode();
      else if (currentTab === 'bookmarks') renderBookmarkMode();
      updateStats();
    }

    function updateStats() {
      const answeredCount = Object.keys(userAnswers).length;
      document.getElementById('progress-text').innerText = `${answeredCount} / 40 題`;
      if (answeredCount > 0) {
        let correctCount = 0;
        Object.keys(userAnswers).forEach(qId => {
          const item = examData.find(x => x.id == qId);
          if (item && userAnswers[qId] === item.answer) correctCount++;
        });
        document.getElementById('accuracy-text').innerText = `${Math.round((correctCount / answeredCount) * 100)} %`;
      } else {
        document.getElementById('accuracy-text').innerText = `-- %`;
      }
    }

    function renderStudyMode() {
      const container = document.getElementById('study-list-container');
      const list = getFilteredData();
      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-slate-500 border border-slate-200">未找到符合條件的題目。</div>`;
        return;
      }
      let html = '';
      let currentPassageId = null;
      list.forEach((q) => {
        const isBookmarked = bookmarkedIds.has(q.id);
        if (q.passageText && q.passageId !== currentPassageId) {
          currentPassageId = q.passageId;
          html += `<div class="bg-sky-50/80 border border-sky-200 rounded-2xl p-6 shadow-sm mb-4"><div class="flex items-center gap-2 mb-3"><span class="bg-sky-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">閱讀文章 / 題組</span><h3 class="font-bold text-slate-800 text-base">${q.passageTitle || ''}</h3></div><div class="prose text-sm text-slate-700 leading-relaxed bg-white p-4 rounded-xl border border-sky-100 shadow-inner">${q.passageText}</div></div>`;
        }
        html += `<div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm relative"><div class="flex items-center justify-between gap-2 mb-4"><div class="flex items-center gap-2 flex-wrap"><span class="bg-slate-900 text-white text-xs font-bold px-2.5 py-1 rounded-lg">第 ${q.id} 題</span><span class="bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-lg">${q.catTitle}</span>${q.badge ? `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-lg">${q.badge}</span>` : ''}</div><button onclick="toggleBookmark(${q.id})" class="p-2 text-slate-400 hover:text-amber-500"><i class="${isBookmarked ? 'fa-solid fa-star text-amber-500 text-lg' : 'fa-regular fa-star text-lg'}"></i></button></div><div class="text-sm md:text-base font-semibold text-slate-800 leading-relaxed mb-3 whitespace-pre-line">${q.question}</div>${q.svgType ? getSvgMarkup(q.svgType) : ''}<div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 my-4">${q.options.map((opt, idx) => `<div class="p-3 rounded-xl border ${idx === q.answer ? 'bg-emerald-50/80 border-emerald-300 text-emerald-900 font-medium' : 'bg-slate-50/60 border-slate-200 text-slate-700'} text-xs md:text-sm flex items-center justify-between"><span>${opt}</span>${idx === q.answer ? '<span class="text-emerald-600 font-bold text-xs"><i class="fa-solid fa-circle-check"></i> 正確答案</span>' : ''}</div>`).join('')}</div>${q.translation ? `<div class="my-3 p-3 bg-slate-50 border-l-4 border-slate-400 text-xs text-slate-600 rounded-r-lg"><span class="font-bold text-slate-700">【中文翻譯】</span> ${q.translation}</div>` : ''}<div class="mt-4 pt-4 border-t border-slate-100 bg-sky-50/40 p-4 rounded-xl border border-sky-100/80"><div class="flex items-center gap-2 text-sky-800 font-bold text-xs mb-1"><i class="fa-solid fa-lightbulb"></i> 觀念解析與考點說明：</div><p class="text-xs md:text-sm text-slate-700 leading-relaxed">${q.explanation}</p></div></div>`;
      });
      container.innerHTML = html;
    }

    function renderQuizMode() {
      const container = document.getElementById('quiz-list-container');
      const list = getFilteredData();
      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-slate-500 border border-slate-200">未找到符合條件的題目。</div>`;
        return;
      }
      let html = '';
      let currentPassageId = null;
      list.forEach((q) => {
        const userSel = userAnswers[q.id];
        const isChecked = checkedQuizIds.has(q.id);
        if (q.passageText && q.passageId !== currentPassageId) {
          currentPassageId = q.passageId;
          html += `<div class="bg-sky-50/80 border border-sky-200 rounded-2xl p-6 shadow-sm mb-4"><div class="flex items-center gap-2 mb-3"><span class="bg-sky-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">閱讀文章 / 題組</span><h3 class="font-bold text-slate-800 text-base">${q.passageTitle || ''}</h3></div><div class="prose text-sm text-slate-700 leading-relaxed bg-white p-4 rounded-xl border border-sky-100 shadow-inner">${q.passageText}</div></div>`;
        }
        html += `<div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm relative"><div class="flex items-center justify-between gap-2 mb-4"><div class="flex items-center gap-2"><span class="bg-slate-900 text-white text-xs font-bold px-2.5 py-1 rounded-lg">第 ${q.id} 題</span><span class="bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-lg">${q.catTitle}</span></div>${isChecked ? (userSel === q.answer ? '<span class="text-emerald-600 font-bold text-xs bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200"><i class="fa-solid fa-circle-check"></i> 答對了！</span>' : '<span class="text-rose-600 font-bold text-xs bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200"><i class="fa-solid fa-circle-xmark"></i> 答錯了</span>') : ''}</div><div class="text-sm md:text-base font-semibold text-slate-800 leading-relaxed mb-3 whitespace-pre-line">${q.question}</div>${q.svgType ? getSvgMarkup(q.svgType) : ''}<div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 my-4">${q.options.map((opt, idx) => {
          const isSelected = userSel === idx;
          let btnStyle = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100';
          if (isChecked) {
            if (idx === q.answer) btnStyle = 'bg-emerald-100 border-emerald-400 text-emerald-900 font-bold';
            else if (isSelected) btnStyle = 'bg-rose-100 border-rose-400 text-rose-900 font-bold';
          } else if (isSelected) btnStyle = 'bg-sky-100 border-sky-400 text-sky-900 font-bold shadow-sm';
          return `<button onclick="selectOption(${q.id}, ${idx})" class="p-3 rounded-xl border text-left text-xs md:text-sm transition-all flex items-center justify-between ${btnStyle}"><span>${opt}</span>${isSelected ? '<i class="fa-solid fa-circle-dot text-sky-600"></i>' : '<i class="fa-regular fa-circle text-slate-300"></i>'}</button>`;
        }).join('')}</div><div class="flex items-center justify-between pt-3 border-t border-slate-100"><button onclick="checkAnswer(${q.id})" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold"><i class="fa-solid fa-magnifying-glass mr-1"></i> 即時核對解析</button></div>${isChecked ? `<div class="mt-4 pt-4 border-t border-slate-100 bg-sky-50/50 p-4 rounded-xl border border-sky-100"><div class="font-bold text-sky-800 text-xs mb-1">【解析與考點】</div><p class="text-xs md:text-sm text-slate-700 leading-relaxed">${q.explanation}</p></div>` : ''}</div>`;
      });
      container.innerHTML = html;
    }

    function selectOption(qId, optIdx) { userAnswers[qId] = optIdx; renderQuizMode(); updateStats(); }
    function checkAnswer(qId) { if (userAnswers[qId] === undefined) { alert('請先點選答案再點擊核對！'); return; } checkedQuizIds.add(qId); renderQuizMode(); }
    function resetQuiz() { if (confirm('確定要重設所有作答嗎？')) { userAnswers = {}; checkedQuizIds.clear(); renderQuizMode(); updateStats(); } }
    function submitQuiz() {
      let totalScore = 0;
      examData.forEach(q => {
        checkedQuizIds.add(q.id);
        if (userAnswers[q.id] === q.answer) totalScore += q.score;
        else if (userAnswers[q.id] !== undefined) bookmarkedIds.add(q.id);
      });
      document.getElementById('bookmark-count').innerText = bookmarkedIds.size;
      renderQuizMode();
      updateStats();
      alert(`🎉 測驗完成！\n\n您的得分為：${totalScore} / 100 分`);
    }

    function renderBookmarkMode() {
      const container = document.getElementById('bookmark-list-container');
      const list = examData.filter(q => bookmarkedIds.has(q.id));
      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-12 text-center text-slate-500 border border-slate-200"><i class="fa-regular fa-star text-4xl text-slate-300 mb-3 block"></i><p class="font-bold text-slate-700">目前尚無錯題或收藏題目</p></div>`;
        return;
      }
      let html = '';
      list.forEach(q => {
        html += `<div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm relative"><div class="flex items-center justify-between gap-2 mb-4"><div class="flex items-center gap-2"><span class="bg-amber-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg">第 ${q.id} 題</span><span class="bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-lg">${q.catTitle}</span></div><button onclick="toggleBookmark(${q.id})" class="text-xs text-rose-500 font-semibold hover:underline"><i class="fa-solid fa-trash-can mr-1"></i> 移除收藏</button></div><div class="text-sm md:text-base font-semibold text-slate-800 leading-relaxed mb-3">${q.question}</div>${q.svgType ? getSvgMarkup(q.svgType) : ''}<div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl my-3 text-xs md:text-sm text-emerald-900 font-medium"><span class="font-bold">【正確答案】</span> ${q.options[q.answer]}</div><div class="p-4 bg-sky-50 rounded-xl border border-sky-100 text-xs md:text-sm text-slate-700 leading-relaxed"><div class="font-bold text-sky-800 mb-1">【重點解析】</div>${q.explanation}</div></div>`;
      });
      container.innerHTML = html;
    }
  </script>
</body>
</html>
