                <div className="min-h-screen flex flex-col">
                    {/* Header Banner */}
                    <header className="bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-600 text-white shadow-lg">
                        <div className="max-w-6xl mx-auto px-4 py-6">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <span className="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold mb-2 backdrop-blur-sm">
                                        九年級拔尖班 • 英語 3800 第 2 回閱讀解析
                                    </span>
                                    <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">
                                        英語閱讀 互動式學習網站
                                    </h1>
                                    <p className="text-indigo-100 text-sm mt-1">
                                        完整收錄 1~43 題閱讀單題與閱讀題組解析・即時測驗與複習錯題
                                    </p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <a
                                        href="../index.html"
                                        className="px-4 py-2 bg-white text-indigo-700 hover:bg-indigo-50 rounded-lg text-xs font-bold transition flex items-center gap-2 shadow-sm"
                                    >
                                        <i className="fa-solid fa-house"></i> 回首頁
                                    </a>
                                    <button 
                                        onClick={() => { setUserAnswers({}); setShowResults(false); }}
                                        className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-xs font-bold transition flex items-center gap-2 border border-white/20"
                                    >
                                        <i className="fa-solid fa-rotate-left"></i> 重置所有答案
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <div className="max-w-6xl mx-auto px-4 flex overflow-x-auto gap-2 pt-2 custom-scrollbar">
                            <button
                                onClick={() => setActiveTab('quiz')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 whitespace-nowrap ${
                                    activeTab === 'quiz' 
                                        ? 'bg-fuchsia-50 text-indigo-900 shadow' 
                                        : 'text-indigo-100 hover:bg-white/10'
                                }`}
                            >
                                <i className="fa-solid fa-pen-to-square"></i> 🎯 互動測驗模式
                            </button>
                            <button
                                onClick={() => setActiveTab('study')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 whitespace-nowrap ${
                                    activeTab === 'study' 
                                        ? 'bg-fuchsia-50 text-indigo-900 shadow' 
                                        : 'text-indigo-100 hover:bg-white/10'
                                }`}
                            >
                                <i className="fa-solid fa-book-open"></i> 📚 逐題詳細解析
                            </button>
                            <button
                                onClick={() => setActiveTab('passages')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 whitespace-nowrap ${
                                    activeTab === 'passages' 
                                        ? 'bg-fuchsia-50 text-indigo-900 shadow' 
                                        : 'text-indigo-100 hover:bg-white/10'
                                }`}
                            >
                                <i className="fa-solid fa-newspaper"></i> 📖 閱讀文章總覽
                            </button>
                            <button
                                onClick={() => setActiveTab('mistake')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 whitespace-nowrap ${
                                    activeTab === 'mistake' 
                                        ? 'bg-fuchsia-50 text-indigo-900 shadow' 
                                        : 'text-indigo-100 hover:bg-white/10'
                                }`}
                            >
                                <i className="fa-solid fa-bookmark"></i> ⭐ 收藏與錯題本 ({bookmarks.length})
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
                        {/* Control Bar: Filter & Search */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-2 overflow-x-auto w-full sm:w-auto">
                                <button
                                    onClick={() => setFilterPart('all')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                                        filterPart === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    全部題目 (1-43)
                                </button>
                                <button
                                    onClick={() => setFilterPart('single')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                                        filterPart === 'single' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    第一部分：單題 (1-22)
                                </button>
                                <button
                                    onClick={() => setFilterPart('group')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap ${
                                        filterPart === 'group' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    第二部分：題組 (23-43)
                                </button>
                            </div>

                            {/* Search Input */}
                            <div className="relative w-full sm:w-64">
                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                <input
                                    type="text"
                                    placeholder="搜尋題目、解析關鍵字..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-9 pr-4 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                            </div>
                        </div>

                        {/* QUIZ MODE */}
                        {activeTab === 'quiz' && (
                            <div className="space-y-6">
                                {/* Scoreboard Bar */}
                                <div className="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-6 rounded-2xl shadow-md flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div>
                                        <h2 className="text-xl font-bold flex items-center gap-2">
                                            <i className="fa-solid fa-chart-line text-yellow-400"></i> 答題進度與成績統計
                                        </h2>
                                        <p className="text-slate-300 text-xs mt-1">
                                            已回答: <span className="font-bold text-white">{Object.keys(userAnswers).length}</span> / {questionsData.length} 題
                                        </p>
                                    </div>

                                    {showResults ? (
                                        <div className="flex items-center gap-6 bg-white/10 p-4 rounded-xl border border-white/10">
                                            <div className="text-center">
                                                <div className="text-xs text-slate-300">答對題數</div>
                                                <div className="text-2xl font-black text-emerald-400">{calculateScore.correctCount} / 43</div>
                                            </div>
                                            <div className="h-8 w-px bg-white/20"></div>
                                            <div className="text-center">
                                                <div className="text-xs text-slate-300">正確率</div>
                                                <div className="text-2xl font-black text-amber-300">{calculateScore.percentage}%</div>
                                            </div>
                                            <div className="h-8 w-px bg-white/20"></div>
                                            <div className="text-center">
                                                <div className="text-xs text-slate-300">評定等級</div>
                                                <div className="text-xl font-extrabold text-pink-300">{calculateScore.grade}</div>
                                            </div>
                                        </div>
                                    ) : (
                                        <button
                                            onClick={() => setShowResults(true)}
                                            className="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-sm rounded-xl shadow-lg transition transform hover:-translate-y-0.5"
                                        >
                                            <i className="fa-solid fa-paper-plane mr-2"></i> 交卷並檢視成績解析
                                        </button>
                                    )}
                                </div>

                                {/* Question List */}
                                <div className="space-y-6">
                                    {filteredQuestions.map((q) => {
                                        const isAnswered = userAnswers[q.id] !== undefined;
                                        const isCorrect = userAnswers[q.id] === q.answer;
                                        const isBookmarked = bookmarks.includes(q.id);

                                        return (
                                            <div key={q.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                                {/* Card Header */}
                                                <div className="bg-slate-50 border-b border-slate-200 px-6 py-3 flex items-center justify-between">
                                                    <div className="flex items-center gap-3">
                                                        <span className="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-sm">
                                                            {q.id}
                                                        </span>
                                                        <div>
                                                            <span className="text-xs font-bold text-indigo-700 mr-2">{q.part}</span>
                                                            <span className="text-xs text-slate-500">頁碼: p.{q.page}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full font-medium">
                                                            {q.tag}
                                                        </span>
                                                        <button
                                                            onClick={() => toggleBookmark(q.id)}
                                                            className={`p-2 rounded-full transition ${isBookmarked ? 'text-amber-500 bg-amber-50' : 'text-slate-400 hover:bg-slate-100'}`}
                                                            title="收藏此題"
                                                        >
                                                            <i className={`fa-${isBookmarked ? 'solid' : 'regular'} fa-bookmark text-lg`}></i>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Card Body */}
                                                <div className="p-6">
                                                    {/* Passage Reference Box if Group Question */}
                                                    {q.type === 'group' && readingPassages[q.passageId] && (
                                                        <div className="mb-4">
                                                            <details className="bg-slate-50 rounded-xl border border-slate-200 p-3">
                                                                <summary className="font-bold text-xs text-indigo-700 cursor-pointer flex items-center gap-2">
                                                                    <i className="fa-solid fa-file-lines"></i> 點擊展開/收合題組文章對照 ({readingPassages[q.passageId].title})
                                                                </summary>
                                                                <div 
                                                                    className="mt-3 text-xs leading-relaxed"
                                                                    dangerouslySetInnerHTML={{ __html: readingPassages[q.passageId].content }}
                                                                />
                                                            </details>
                                                        </div>
                                                    )}

                                                    {/* Question Prompt */}
                                                    <div className="flex items-start justify-between gap-4 mb-4">
                                                        <h3 className="text-base font-bold text-slate-800 leading-relaxed">
                                                            {q.question}
                                                        </h3>
                                                        <button
                                                            onClick={() => speakText(q.question)}
                                                            className="text-slate-400 hover:text-indigo-600 transition p-1"
                                                            title="朗讀英文題目"
                                                        >
                                                            <i className="fa-solid fa-volume-high text-lg"></i>
                                                        </button>
                                                    </div>

                                                    {/* Options */}
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                                                        {q.options.map((opt) => {
                                                            const isSelected = userAnswers[q.id] === opt.key;
                                                            let optionStyle = "border-slate-200 bg-slate-50 hover:bg-indigo-50/50 hover:border-indigo-300 text-slate-700";

                                                            if (isSelected) {
                                                                optionStyle = "border-indigo-600 bg-indigo-50 text-indigo-900 font-bold shadow-sm";
                                                            }

                                                            if (showResults) {
                                                                if (opt.key === q.answer) {
                                                                    optionStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold ring-2 ring-emerald-400";
                                                                } else if (isSelected && !isCorrect) {
                                                                    optionStyle = "border-rose-500 bg-rose-50 text-rose-900 font-bold";
                                                                }
                                                            }

                                                            return (
                                                                <button
                                                                    key={opt.key}
                                                                    onClick={() => handleSelectOption(q.id, opt.key)}
                                                                    className={`p-3.5 rounded-xl border text-left text-sm transition flex items-center justify-between ${optionStyle}`}
                                                                >
                                                                    <span>{opt.text}</span>
                                                                    {showResults && opt.key === q.answer && (
                                                                        <i className="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                                                                    )}
                                                                    {showResults && isSelected && !isCorrect && opt.key !== q.answer && (
                                                                        <i className="fa-solid fa-circle-xmark text-rose-500 text-lg"></i>
                                                                    )}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* Explanation Accordion (Visible if submitted or manually toggled) */}
                                                    {showResults && (
                                                        <div className="mt-4 p-4 rounded-xl bg-amber-50 border border-amber-200 text-xs space-y-2">
                                                            <div className="flex items-center justify-between text-amber-900 font-bold border-b border-amber-200 pb-2">
                                                                <span><i className="fa-solid fa-lightbulb text-amber-600 mr-1"></i> 正確答案：( {q.answer} )</span>
                                                                <span className={isCorrect ? "text-emerald-700 font-bold" : "text-rose-600 font-bold"}>
                                                                    {isCorrect ? "答對了！" : `你的選擇: ${userAnswers[q.id] || "未作答"}`}
                                                                </span>
                                                            </div>
                                                            <p className="text-slate-700 leading-relaxed font-medium pt-1">
                                                                {q.explanation}
                                                            </p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* STUDY & EXPLANATIONS MODE */}
                        {activeTab === 'study' && (
                            <div className="space-y-6">
                                <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-indigo-900 text-xs leading-relaxed">
                                    <i className="fa-solid fa-circle-info text-indigo-600 mr-2 text-sm"></i>
                                    <strong>學習模式提示：</strong>此處收錄 1~43 題的完整題目、解答關鍵詞與詳盡中文解析，並提供單字語音朗讀，適合課後複習。
                                </div>

                                <div className="space-y-4">
                                    {filteredQuestions.map((q) => (
                                        <div key={q.id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                                            <div className="flex items-center justify-between border-b pb-3 mb-3">
                                                <div className="flex items-center gap-2">
                                                    <span className="bg-indigo-600 text-white text-xs font-extrabold px-3 py-1 rounded-full">
                                                        第 {q.id} 題
                                                    </span>
                                                    <span className="text-xs font-bold text-slate-500">{q.part} (p.{q.page})</span>
                                                </div>
                                                <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                                                    正確答案: ({q.answer})
                                                </span>
                                            </div>

                                            <div className="mb-3 flex items-start justify-between">
                                                <p className="text-sm font-bold text-slate-800 leading-relaxed">
                                                    {q.question}
                                                </p>
                                                <button 
                                                    onClick={() => speakText(q.question)}
                                                    className="text-indigo-600 hover:text-indigo-800 text-xs font-bold flex items-center gap-1 ml-2 whitespace-nowrap"
                                                >
                                                    <i className="fa-solid fa-volume-high"></i> 朗讀
                                                </button>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-4 text-xs">
                                                {q.options.map(opt => (
                                                    <div 
                                                        key={opt.key}
                                                        className={`p-2.5 rounded-lg border ${
                                                            opt.key === q.answer 
                                                                ? 'bg-emerald-50 border-emerald-300 font-bold text-emerald-900' 
                                                                : 'bg-slate-50 border-slate-200 text-slate-600'
                                                        }`}
                                                    >
                                                        {opt.text}
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="bg-amber-50/80 border border-amber-200 p-3 rounded-xl text-xs text-slate-700 leading-relaxed">
                                                <strong className="text-amber-900 block mb-1">💡 詳盡中文解析：</strong>
                                                {q.explanation}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* READING PASSAGES LIBRARY */}
                        {activeTab === 'passages' && (
                            <div className="space-y-6">
                                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-emerald-900 text-xs">
                                    <i className="fa-solid fa-book text-emerald-600 mr-2"></i>
                                    <strong>閱讀文章庫：</strong>包含第二部分（第 23~43 題）的 7 大主題完整文章與圖表重現，方便對照閱讀訓練。
                                </div>

                                <div className="grid grid-cols-1 gap-6">
                                    {Object.keys(readingPassages).map((key) => {
                                        const p = readingPassages[key];
                                        return (
                                            <div key={key} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-3">
                                                <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
                                                    <i className="fa-solid fa-file-text text-indigo-600"></i> {p.title}
                                                </h3>
                                                <div 
                                                    className="leading-relaxed"
                                                    dangerouslySetInnerHTML={{ __html: p.content }}
                                                />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* MISTAKE NOTEBOOK & BOOKMARKS */}
                        {activeTab === 'mistake' && (
                            <div className="space-y-6">
                                <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-amber-900 text-xs">
                                    <i className="fa-solid fa-star text-amber-600 mr-2"></i>
                                    <strong>錯題與收藏本：</strong>您已手動收藏了 <strong>{bookmarks.length}</strong> 道題目。可在練習時隨時點擊書籤圖示加入。
                                </div>

                                {bookmarks.length === 0 ? (
                                    <div className="bg-white rounded-2xl border border-slate-200 p-12 text-center text-slate-400 space-y-3">
                                        <i className="fa-regular fa-bookmark text-4xl"></i>
                                        <p className="text-sm">目前還沒有收藏任何題目喔！在測驗或解析模式中點擊書籤即可收藏。</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {questionsData.filter(q => bookmarks.includes(q.id)).map(q => (
                                            <div key={q.id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                                                <div className="flex items-center justify-between border-b pb-2 mb-3">
                                                    <span className="font-bold text-sm text-indigo-700">第 {q.id} 題 ({q.part})</span>
                                                    <button 
                                                        onClick={() => toggleBookmark(q.id)}
                                                        className="text-xs text-rose-600 hover:underline flex items-center gap-1"
                                                    >
                                                        <i className="fa-solid fa-trash"></i> 移除收藏
                                                    </button>
                                                </div>
                                                <p className="text-sm font-bold text-slate-800 mb-3">{q.question}</p>
                                                <div className="bg-amber-50 p-3 rounded-xl text-xs text-slate-700">
                                                    <strong>解答與解析:</strong> ({q.answer}) - {q.explanation}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
                        <div className="max-w-6xl mx-auto px-4 space-y-2">
                            <p>第 2 回 國中英語閱讀試題 (頁 23~33) 互動式學習系統</p>
                            <p className="text-slate-500">提供完整 1-43 題測驗、成績評估、英文朗讀與解析庫</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
