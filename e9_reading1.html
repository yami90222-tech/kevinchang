        window.setFontSize = function(size) {
            currentFontSize = size;

                const btn = document.getElementById(`btn-fs-${s}`);
                if (s === size) {
                    btn.className = "px-2.5 py-1 rounded bg-indigo-900 text-white font-bold transition-all shadow text-xs sm:text-sm";
                    btn.textContent = s === 'sm' ? '14px' : s === 'base' ? '16px (預設)' : s === 'lg' ? '18px' : '20px';
                } else {
                    btn.className = "px-2.5 py-1 rounded hover:bg-indigo-800 text-indigo-200 font-medium transition-all text-xs sm:text-sm";

                }
            });
            loadPassageData(selector.value);
        };

        function loadPassageData(key) {
            const data = database[key];
            if (!data) return;

            passageTitle.innerHTML = `<span>📖</span> ${data.title}`;
            passageTag.textContent = data.tag;
            passageContent.innerHTML = data.passage;
            
            passageTranslationContent.innerHTML = data.translation.map(t => `<p>${t}</p>`).join('');
            passageTranslationBox.classList.add('hidden');
            passageTransBtnText.textContent = '顯示文章完整中文翻譯';

            clueHint.classList.remove('hidden');

            let pTextClass = "text-base";
            let optTextClass = "text-sm sm:text-base";
            let vocabTextClass = "text-xs sm:text-sm";

            if (currentFontSize === 'sm') {
                pTextClass = "text-sm";
                optTextClass = "text-xs sm:text-sm";
                vocabTextClass = "text-xs";
            } else if (currentFontSize === 'base') {
                pTextClass = "text-base";
                optTextClass = "text-sm sm:text-base";
                vocabTextClass = "text-xs sm:text-sm";
            } else if (currentFontSize === 'lg') {
                pTextClass = "text-lg";
                optTextClass = "text-base sm:text-lg";
                vocabTextClass = "text-sm sm:text-base";
            } else if (currentFontSize === 'xl') {
                pTextClass = "text-xl";
                optTextClass = "text-lg sm:text-xl";
                vocabTextClass = "text-base sm:text-lg";
            }

            passageContent.className = `prose prose-slate max-w-none ${pTextClass} leading-relaxed space-y-3 sm:space-y-4 text-slate-700 bg-slate-50/50 p-3.5 sm:p-4 rounded-xl border border-slate-100 mb-6 max-h-[350px] sm:max-h-[450px] overflow-y-auto`;

            vocabList.innerHTML = data.vocab.map(v => `

                    <span class="text-slate-600">${v.meaning}</span>
                </div>
            `).join('');

            questionCountTag.textContent = `共 ${data.questions.length} 題`;
            questionsContainer.innerHTML = data.questions.map((qObj) => `
                <div class="bg-slate-50 p-3.5 sm:p-4 rounded-xl border border-slate-200 space-y-3 transition-all hover:shadow-md" onmouseenter="highlightClue('${qObj.clueTarget}', true)" onmouseleave="highlightClue('${qObj.clueTarget}', false)" onclick="highlightClue('${qObj.clueTarget}', true)">
                    <div class="flex justify-between items-start gap-2">
                        <p class="font-bold text-slate-900 ${optTextClass} cursor-pointer hover:text-indigo-600 flex items-start gap-1.5 leading-snug">

        window.togglePassageTranslation = function() {
            if (passageTranslationBox.classList.contains('hidden')) {
                passageTranslationBox.classList.remove('hidden');
                passageTransBtnText.textContent = '隱藏文章完整中文翻譯';
            } else {
                passageTranslationBox.classList.add('hidden');
                passageTransBtnText.textContent = '顯示文章完整中文翻譯';
            }
        };

        window.highlightClue = function(targetId, activate) {
            const elements = passageContent.querySelectorAll(`[data-clue="${targetId}"]`);
            elements.forEach(el => {
                if (activate) {
                    el.classList.add('clue-highlight', 'active');
                } else {
                    el.classList.remove('active');
                    setTimeout(() => el.classList.remove('clue-highlight'), 500);
                }
            });
        };

        window.toggleTranslation = function(questionId) {
            const transBox = document.getElementById(`translation-${questionId}`);
            const btnText = document.getElementById(`trans-btn-text-${questionId}`);
            if (transBox.classList.contains('hidden')) {
                transBox.classList.remove('hidden');
                btnText.textContent = '隱藏中文選項與解析提示';
            } else {
                transBox.classList.add('hidden');
                btnText.textContent = '顯示中文選項與解析提示';
            }
        };

        window.checkAnswer = function(questionId, selectedOpt, correctOpt, btnElement) {
            const container = btnElement.parentElement;
            const buttons = container.querySelectorAll('button');
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-100');
                if (idx === correctOpt) {
                    btn.classList.add('bg-emerald-100', 'border-emerald-500', 'font-semibold', 'text-emerald-900');
                } else if (idx === selectedOpt && selectedOpt !== correctOpt) {
                    btn.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            const expBox = document.getElementById(`explanation-${questionId}`);
            if (expBox) {
                expBox.classList.remove('hidden');
            }
        };

        selector.addEventListener('change', (e) => {
            loadPassageData(e.target.value);
        });

        loadPassageData('p24_25');
