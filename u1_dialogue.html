        const AudioFX = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playCorrect() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now); osc.stop(now + 0.35);
                } catch(e){}
            },
            playWrong() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;

                        const osc = this.ctx.createOscillator();

                        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.25);
                        osc.connect(gain); gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + idx * 0.08);
                        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
                    });
                } catch(e){}
            }
        };

        // --- TTS SPEECH CONTROLLER ---
        let ttsRate = 1.0;

        // 頝函汗?刻??喃耨敺抬?蝑?瘨???????橘?銝阡?典?函?蝢??望?隤??        function speakText(text, callback = null) {
            if (!speechSynth || typeof SpeechSynthesisUtterance === 'undefined') {
                console.warn('甇斤汗?其??舀隤???嚗eb Speech API嚗?);
                if (callback) callback();
                return;
            }

            const requestId = ++ttsRequestId;
            speechSynth.cancel();
            const utterance = new SpeechSynthesisUtterance(String(text));
            utterance.lang = 'en-US';
            utterance.rate = ttsRate;
            utterance.pitch = 1;
            const voices = speechSynth.getVoices ? speechSynth.getVoices() : [];
            const englishVoice = voices.find(v => /^en-US/i.test(v.lang))
                || voices.find(v => /^en/i.test(v.lang));
            if (englishVoice) utterance.voice = englishVoice;

            let callbackCalled = false;
            const finish = () => {
                if (callbackCalled || requestId !== ttsRequestId) return;
                callbackCalled = true;
                if (callback) callback();
            };
            utterance.onend = finish;
            utterance.onerror = (event) => {
                console.warn('隤?剜?潛???嚗?, event.error || event);
                finish();
            };

            // Chrome/Edge ??cancel() 敺???speak() ?嗥??莎?蝔?撱園頛帘摰?            window.setTimeout(() => {
                if (requestId !== ttsRequestId) return;
                try {
                    speechSynth.resume();
                    speechSynth.speak(utterance);
                } catch (err) {
                    console.error('?⊥???隤?剜嚗?, err);
                    finish();
                }
            }, 120);
        }

    <!-- ?函??? 5 蝘?COOL DOWN嚗誑鈭辣憪晷?舀????????? -->
    <script>
    (() => {
        const COOLDOWN_MS = 5000;
        const cooldowns = new WeakMap();

        document.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button) return;

            const now = Date.now();
            const active = cooldowns.get(button);
            if (active && active.until > now) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return;
            }
            if (button.disabled) return;

            const state = {
                until: now + COOLDOWN_MS,
                originalHTML: button.innerHTML,
                wasDisabled: button.disabled,
                timer: null
            };
            cooldowns.set(button, state);
            button.dataset.cooldownActive = 'true';
            button.setAttribute('aria-live', 'polite');
            button.classList.add('opacity-60', 'cursor-not-allowed');

            // 撱嗅??嚗Ⅱ靽活暺??蝬????質甇?虜?瑁???            window.setTimeout(() => {
                if (cooldowns.get(button) === state) button.disabled = true;
            }, 0);

            const refresh = () => {
                const remaining = Math.max(0, Math.ceil((state.until - Date.now()) / 1000));
                if (remaining > 0) {
                    button.innerHTML = `COOL DOWN ${remaining}s`;
                    return;
                }
                window.clearInterval(state.timer);
                button.innerHTML = state.originalHTML;
                button.disabled = state.wasDisabled;
                button.classList.remove('opacity-60', 'cursor-not-allowed');
                button.removeAttribute('data-cooldown-active');
                button.removeAttribute('aria-live');
                cooldowns.delete(button);
            };
            refresh();
            state.timer = window.setInterval(refresh, 200);
        }, true);
    })();
    </script>
